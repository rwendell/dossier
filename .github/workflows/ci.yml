name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/aube-action@v1
        with:
          node-version: "22"
          run-install: true

      - name: Typecheck
        run: aube run typecheck

      - name: Test
        run: aube run test

      - name: Build
        run: aube run build
